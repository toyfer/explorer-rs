name: Fix icon_cache_key via Actions

on:
  push:
    branches: [feat/file-icons-11c]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/file-icons-11c
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: git fetch origin main --depth 1
      - name: Patch icon_cache_key if truncated
        run: |
          python3 << 'PY'
          import pathlib, subprocess
          p = pathlib.Path("src/app.rs")
          t = p.read_text(encoding="utf-8")
          truncated = "    fn icon_cache_key(path: &Path, is_dir: bool) -> String {\n        if is_dir {\n            return \"__dir__\".to_string();\n        }\n    \n    fn get_or_load_icon"
          correct = "    fn icon_cache_key(path: &Path, is_dir: bool) -> String {\n        if is_dir {\n            return \"__dir__\".to_string();\n        }\n        let ext = path\n            .extension()\n            .and_then(|s| s.to_str())\n            .unwrap_or(\"\")\n            .to_lowercase();\n        if ext == \"exe\" || ext == \"ico\" || ext == \"lnk\" {\n            return format!(\"file:{}\", path.display());\n        }\n        format!(\"ext:{ext}\")\n    }\n\n    fn get_or_load_icon"
          if truncated in t:
              t = t.replace(truncated, correct, 1)
              p.write_text(t, encoding="utf-8")
              print("Fixed truncated icon_cache_key")
          else:
              print("icon_cache_key not truncated, checking orphan")
              # also ensure no stray orphan remains outside fn
              stray = "    let ext = path\n            .extension()\n            .and_then(|s| s.to_str())\n            .unwrap_or(\"\")\n            .to_lowercase();\n        if ext == \"exe\" || ext == \"ico\" || ext == \"lnk\" {\n            return format!(\"file:{}\", path.display());\n        }\n        format!(\"ext:{ext}\")\n    }"
              if stray in t and t.count(stray) >= 1:
                  # if icon_cache_key already correct, this stray is orphan -> remove one
                  # But we already fixed truncated case, so skip
                  pass
          print(f"lines {len(t.splitlines())}")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs
          if git diff --staged --quiet; then echo "no diff"; else git commit -m "fix(file_icons): restore icon_cache_key body (Actions)" && git push; fi
