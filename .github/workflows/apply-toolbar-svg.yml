name: Apply toolbar SVG wire

on:
  push:
    branches: [fix/toolbar-svg-11b]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/toolbar-svg-11b

      - name: Apply patch to app.rs
        run: python3 scripts/apply_toolbar_svg.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat(ui): wire toolbar SVG icons (Context7 egui_extras)"
            git push
          fi
