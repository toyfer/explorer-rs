name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0) — leave empty to use Cargo.toml'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: explorer-rs

jobs:
  build-windows:
    name: Build Windows x86_64 (single binary)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo (perf)
        uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $cargoVer = ""
          $m = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"'
          if ($m) { $cargoVer = $m.Matches[0].Groups[1].Value }
          if (-not $cargoVer) { $cargoVer = "0.0.0" }
          $shortSha = "${{ github.sha }}".Substring(0,7)
          $ref = "${{ github.ref }}"
          $refName = "${{ github.ref_name }}"
          $inputVer = "${{ inputs.version }}"
          $resolved = ""
          $isPrerelease = "false"
          if ($ref -like "refs/tags/v*") {
            $resolved = $refName
            if ($resolved -match "alpha|beta|rc|nightly") { $isPrerelease = "true" }
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and $inputVer -ne "") {
            $resolved = $inputVer
            if ($resolved -notlike "v*") { $resolved = "v$resolved" }
            if ($resolved -match "alpha|beta|rc|nightly") { $isPrerelease = "true" }
          } else {
            # push to main -> try stable tag v<Cargo.toml> first
            $candidate = "v$cargoVer"
            git fetch --tags 2>$null | Out-Null
            $exists = (git tag -l $candidate)
            if (-not $exists) {
              $resolved = $candidate
            } else {
              # version already released -> nightly prerelease so every merge still yields an exe
              $resolved = "v$cargoVer-nightly-$shortSha"
              $isPrerelease = "true"
            }
            # ensure we don't collide with an existing nightly tag (extremely unlikely)
            $tries = 0
            while ((git tag -l $resolved) -and $tries -lt 5) {
              $resolved = "v$cargoVer-nightly-$shortSha-$tries"
              $tries++
            }
          }
          Write-Host "cargoVer=$cargoVer resolved=$resolved prerelease=$isPrerelease"
          "version=$resolved" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          "cargo_version=$cargoVer" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8
          "prerelease=$isPrerelease" | Out-File -Append $env:GITHUB_OUTPUT -Encoding utf8

      - name: Build release (single binary, crt-static, lto)
        run: cargo build --release --verbose
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Verify Windows PE + size
        shell: pwsh
        run: |
          $bin = "target/release/${{ env.BIN_NAME }}.exe"
          if (!(Test-Path $bin)) { Write-Error "explorer-rs.exe not found"; exit 1 }
          $magic = [System.IO.File]::ReadAllBytes($bin)[0..1] | ForEach-Object { "{0:X2}" -f $_ }
          Write-Host "Magic: $($magic -join ' ')"
          if ($magic[0] -ne "4D" -or $magic[1] -ne "5A") { Write-Error "Not a Windows PE"; exit 1 }
          $size = (Get-Item $bin).Length / 1MB
          Write-Host "Windows PE verified, size: $size MB"
          Get-Item $bin | Format-List

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          if (-not $version) { $version = "dev" }
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target/release/${{ env.BIN_NAME }}.exe" "$dist/"
          if (Test-Path "README.md") { Copy-Item "README.md" "$dist/" }
          if (Test-Path "LICENSE-MIT") { Copy-Item "LICENSE-MIT" "$dist/" }
          @"
          explorer-rs $version — Portable Windows
          ========================================
          explorer-rs.exe をダブルクリックで起動できます。
          インストーラ不要の単一バイナリです。
          日本語フォントは自動で游ゴシック/メイリオ等を読み込み、左「表示」で変更できます。
          設定は %APPDATA%\explorer-rs\config.json に保存されます。
          "@ | Out-File -Encoding utf8 "$dist/README_PORTABLE.txt"
          $zip = "${{ env.BIN_NAME }}-windows-x86_64-$version.zip"
          Compress-Archive -Path "$dist/*" -DestinationPath $zip -Force
          Write-Host "Created $zip"
          Get-Item $zip | Format-List

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: explorer-rs-windows-x86_64
          path: "*.zip"
          retention-days: 30

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v4
        with:
          name: explorer-rs-exe
          path: target/release/${{ env.BIN_NAME }}.exe
          retention-days: 30

      - name: Create GitHub Release (auto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            *.zip
            target/release/${{ env.BIN_NAME }}.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body: |
            ## explorer-rs ${{ steps.version.outputs.version }}

            Windows 向け**単一バイナリ**のポータブル版です。（自動リリース）

            - Cargo.toml: `${{ steps.version.outputs.cargo_version }}`
            - コミット: `${{ github.sha }}`
            - 日本語フォント自動対応（游ゴシック/メイリオ等）、「表示」で変更可能

            ### ダウンロード
            - `explorer-rs-windows-x86_64-${{ steps.version.outputs.version }}.zip` — 推奨
            - `explorer-rs.exe` — 単体

            ### 使い方
            1. zip を解凍
            2. `explorer-rs.exe` をダブルクリック
            3. 設定は `%APPDATA%\explorer-rs\config.json` に自動保存
