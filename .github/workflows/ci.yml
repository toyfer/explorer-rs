name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows build / test (fetchable logs)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rust version
        run: rustc --version && cargo --version && rustup show

      - name: Cargo check
        id: check
        continue-on-error: true
        shell: pwsh
        run: |
          cargo check --all-targets --verbose 2>&1 | Tee-Object -FilePath check.log
          $code = $LASTEXITCODE
          "check_exit=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "check exit: $code"
          exit 0

      - name: Clippy
        continue-on-error: true
        shell: pwsh
        run: |
          cargo clippy --all-targets -- -W clippy::all 2>&1 | Tee-Object -FilePath clippy.log
          Write-Host "clippy exit: $LASTEXITCODE"
          exit 0

      - name: Tests
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test --all --verbose 2>&1 | Tee-Object -FilePath test.log
          Write-Host "test exit: $LASTEXITCODE"
          exit 0

      - name: Build release
        continue-on-error: true
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --release --verbose 2>&1 | Tee-Object -FilePath build.log
          Write-Host "build exit: $LASTEXITCODE"
          exit 0

      - name: Verify PE
        shell: pwsh
        run: |
          $bin = "target/release/explorer-rs.exe"
          if (Test-Path $bin) {
            $b = [System.IO.File]::ReadAllBytes($bin)
            $magic = "{0:X2} {1:X2}" -f $b[0], $b[1]
            $size = [math]::Round($b.Length / 1MB, 2)
            "PE=$magic size_mb=$size" | Tee-Object -FilePath pe.log
            if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { "NOT_PE" | Out-File pe.log -Append }
          } else {
            "MISSING" | Tee-Object -FilePath pe.log
          }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-windows
          path: |
            check.log
            clippy.log
            test.log
            build.log
            pe.log
          if-no-files-found: warn
          retention-days: 14

      # Publish logs to ci-logs branch so agents can fetch via Contents API
      - name: Publish logs to ci-logs branch
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $sha7 = "${{ github.sha }}".Substring(0, 7)
          $runId = "${{ github.run_id }}"
          $dir = "logs/$sha7"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($f in @("check.log","clippy.log","test.log","build.log","pe.log")) {
            if (Test-Path $f) { Copy-Item $f "$dir/" -Force }
          }
          # tails for quick fetch
          if (Test-Path check.log) {
            Get-Content check.log -Tail 250 | Out-File "$dir/check.tail.txt" -Encoding utf8
          }
          if (Test-Path build.log) {
            Get-Content build.log -Tail 250 | Out-File "$dir/build.tail.txt" -Encoding utf8
          }
          if (Test-Path clippy.log) {
            Get-Content clippy.log -Tail 250 | Out-File "$dir/clippy.tail.txt" -Encoding utf8
          }
          if (Test-Path test.log) {
            Get-Content test.log -Tail 150 | Out-File "$dir/test.tail.txt" -Encoding utf8
          }
          @"
          sha=${{ github.sha }}
          run_id=$runId
          ref=${{ github.ref }}
          actor=${{ github.actor }}
          time=$(Get-Date -Format o)
          "@ | Out-File "$dir/meta.txt" -Encoding utf8

          git config user.name "ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs --depth=1 2>$null
          if ($LASTEXITCODE -eq 0) {
            git checkout ci-logs
          } else {
            git checkout --orphan ci-logs
            git rm -rf . 2>$null | Out-Null
          }
          New-Item -ItemType Directory -Force -Path "logs/$sha7" | Out-Null
          Copy-Item -Recurse -Force $dir/* "logs/$sha7/" -ErrorAction SilentlyContinue
          # restore from workspace if checkout wiped
          if (-not (Test-Path "logs/$sha7/meta.txt")) {
            New-Item -ItemType Directory -Force -Path "logs/$sha7" | Out-Null
            foreach ($f in @("check.log","clippy.log","test.log","build.log","pe.log")) {
              if (Test-Path $f) { Copy-Item $f "logs/$sha7/" }
            }
          }
          git add "logs/$sha7"
          git status
          git commit -m "ci logs $sha7 run $runId" 2>&1 | Out-Host
          if ($LASTEXITCODE -eq 0) {
            git push origin HEAD:ci-logs --force 2>&1 | Out-Host
            Write-Host "Published https://github.com/${{ github.repository }}/tree/ci-logs/logs/$sha7"
          } else {
            Write-Host "Nothing to commit or commit failed"
          }
