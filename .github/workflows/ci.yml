name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (stable + perf + fetchable logs)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Versions
        run: rustc -vV && cargo -vV

      - name: Cargo check
        id: check
        continue-on-error: true
        shell: pwsh
        run: |
          cargo check --all-targets --verbose 2>&1 | Tee-Object -FilePath check.log
          "exit=$LASTEXITCODE" | Out-File check.exit.txt -Encoding utf8
          exit 0

      - name: Clippy
        continue-on-error: true
        shell: pwsh
        run: |
          cargo clippy --all-targets -- -W clippy::all 2>&1 | Tee-Object -FilePath clippy.log
          "exit=$LASTEXITCODE" | Out-File clippy.exit.txt -Encoding utf8
          exit 0

      - name: Tests
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test --all --verbose 2>&1 | Tee-Object -FilePath test.log
          "exit=$LASTEXITCODE" | Out-File test.exit.txt -Encoding utf8
          exit 0

      - name: Build release (crt-static)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --release --verbose 2>&1 | Tee-Object -FilePath build.log
          "exit=$LASTEXITCODE" | Out-File build.exit.txt -Encoding utf8
          exit 0

      - name: PE verify
        shell: pwsh
        run: |
          $bin = "target/release/explorer-rs.exe"
          if (Test-Path $bin) {
            $b = [IO.File]::ReadAllBytes($bin)
            $line = "PE_MAGIC={0:X2}{1:X2} SIZE_MB={2}" -f $b[0], $b[1], [math]::Round($b.Length/1MB,2)
            $line | Tee-Object pe.log
          } else {
            "PE_MISSING" | Tee-Object pe.log
          }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-windows
          path: |
            check.log
            clippy.log
            test.log
            build.log
            pe.log
            *.exit.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish logs to ci-logs branch
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha7 = "${{ github.sha }}".Substring(0, 7)
          $run = "${{ github.run_id }}"
          $staging = Join-Path $env:RUNNER_TEMP "logstage"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          foreach ($f in @("check.log","clippy.log","test.log","build.log","pe.log","check.exit.txt","clippy.exit.txt","test.exit.txt","build.exit.txt")) {
            if (Test-Path $f) { Copy-Item $f $staging -Force }
          }
          if (Test-Path check.log) { Get-Content check.log -Tail 300 | Set-Content (Join-Path $staging "check.tail.txt") -Encoding utf8 }
          if (Test-Path build.log) { Get-Content build.log -Tail 300 | Set-Content (Join-Path $staging "build.tail.txt") -Encoding utf8 }
          if (Test-Path clippy.log) { Get-Content clippy.log -Tail 200 | Set-Content (Join-Path $staging "clippy.tail.txt") -Encoding utf8 }
          if (Test-Path test.log) { Get-Content test.log -Tail 150 | Set-Content (Join-Path $staging "test.tail.txt") -Encoding utf8 }
          @"
          sha=${{ github.sha }}
          run_id=$run
          time=$(Get-Date -Format o)
          "@ | Set-Content (Join-Path $staging "meta.txt") -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs --depth=1 2>&1 | Out-Host
          if ($LASTEXITCODE -eq 0) {
            git checkout ci-logs
          } else {
            git checkout --orphan ci-logs
            git rm -rf . 2>$null | Out-Null
          }
          $dest = "logs/$sha7"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item (Join-Path $staging "*") $dest -Force
          git add $dest
          git status
          git commit -m "ci logs $sha7 run $run" 2>&1 | Out-Host
          if ($LASTEXITCODE -eq 0) {
            git push origin HEAD:ci-logs --force 2>&1 | Out-Host
            Write-Host "Logs: https://github.com/${{ github.repository }}/tree/ci-logs/logs/$sha7"
          } else {
            Write-Host "No commit (empty?)"
          }
