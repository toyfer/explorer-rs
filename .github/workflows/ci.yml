name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows build / test (diagnostic)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rust version
        run: rustc --version; cargo --version; rustup show

      - name: Cargo check (diagnostic)
        id: check
        continue-on-error: true
        shell: pwsh
        run: |
          cargo check --all-targets --verbose 2>&1 | Tee-Object -FilePath check.log
          $code = $LASTEXITCODE
          Write-Host "check exit code: $code"
          if ($code -ne 0) { Write-Host "::warning::cargo check failed with $code" }
          exit 0

      - name: Clippy (diagnostic)
        continue-on-error: true
        shell: pwsh
        run: |
          cargo clippy --all-targets -- -W clippy::pedantic 2>&1 | Tee-Object -FilePath clippy.log
          Write-Host "clippy finished with $LASTEXITCODE"

      - name: Tests
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test --all --verbose 2>&1 | Tee-Object -FilePath test.log
          Write-Host "test exit: $LASTEXITCODE"

      - name: Build release (single binary)
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --release --verbose 2>&1 | Tee-Object -FilePath build.log
          Write-Host "build exit: $LASTEXITCODE"

      - name: Verify Windows PE (if built)
        shell: pwsh
        run: |
          $bin = "target/release/explorer-rs.exe"
          if (Test-Path $bin) {
            $magic = [System.IO.File]::ReadAllBytes($bin)[0..1] | ForEach-Object { "{0:X2}" -f $_ }
            Write-Host "Magic: $($magic -join ' ')"
            $size = (Get-Item $bin).Length / 1MB
            Write-Host "OK Windows PE size $size MB"
          } else {
            Write-Host "::warning::explorer-rs.exe not found - build likely failed, see build.log"
            Get-ChildItem target/release -ErrorAction SilentlyContinue | Format-Table
          }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-windows
          path: |
            check.log
            clippy.log
            test.log
            build.log
          if-no-files-found: warn
          retention-days: 7
