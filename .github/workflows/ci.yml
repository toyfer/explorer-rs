name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows build / test (stable + perf)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Stability gates (must pass)
      - name: Cargo check (Windows)
        run: cargo check --all-targets

      - name: Tests (stability)
        run: cargo test --all

      # Advisory: do not block CI on clippy pedantic warnings
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets -- -W clippy::pedantic -- -A clippy::too_many_lines -A clippy::single_match || echo "clippy advisory finished"

      # Performance: single-binary release
      - name: Build release (single binary, Windows)
        run: cargo build --release --verbose
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Verify Windows PE
        shell: pwsh
        run: |
          $bin = "target/release/explorer-rs.exe"
          if (!(Test-Path $bin)) { Write-Error "explorer-rs.exe not found"; exit 1 }
          $magic = [System.IO.File]::ReadAllBytes($bin)[0..1] | ForEach-Object { "{0:X2}" -f $_ }
          Write-Host "First 2 bytes: $($magic -join ' ')"
          if ($magic[0] -ne "4D" -or $magic[1] -ne "5A") { Write-Error "Not a Windows PE (MZ missing)"; exit 1 }
          $size = (Get-Item $bin).Length / 1MB
          Write-Host "OK Windows PE, size: $size MB"
