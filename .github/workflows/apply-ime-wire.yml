name: Apply IME handle_typeahead wire

on:
  push:
    branches: [fix/ime-wire-typeahead]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/ime-wire-typeahead

      - name: Apply patch to app.rs
        run: python3 scripts/apply_handle_typeahead.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.rs
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat(ime): wire handle_typeahead to filter route (Context7 Text-first)"
            git push
          fi
