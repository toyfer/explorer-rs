[package]
name = "explorer-rs"
version = "0.1.1"
edition = "2021"
description = "Explorer++ inspired high-performance file manager for Windows - single binary, Rust + egui"
authors = ["explorer-rs contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/toyfer/explorer-rs"
keywords = ["file-manager", "explorer", "egui", "windows", "desktop"]
categories = ["gui"]
readme = "README.md"
rust-version = "1.75"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["image", "all_loaders"] }
chrono = { version = "0.4", features = ["clock"] }
dirs = "5.0"
open = "5.3"
trash = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.4"
rfd = "0.14"
notify = "6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_Ole",
  "Win32_System_Com_StructuredStorage",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
